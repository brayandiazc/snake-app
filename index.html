<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snake — el clásico de pantalla verde</title>
    <meta
      name="description"
      content="Juega al Snake clásico de pantalla verde en tu navegador. Sin instalar nada."
    />
    <link rel="canonical" href="https://snake-app-mu.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://snake-app-mu.vercel.app/" />
    <meta property="og:title" content="Snake — el clásico de pantalla verde" />
    <meta
      property="og:description"
      content="Juega al Snake clásico de pantalla verde en tu navegador. Sin instalar nada."
    />
    <meta
      property="og:image"
      content="https://snake-app-mu.vercel.app/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/assets/fonts/orbitron-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/design/tokens.css" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <main class="page">
      <h1 class="visually-hidden">Snake</h1>
      <div class="device">
        <div class="screen">
          <canvas
            class="board"
            role="img"
            aria-label="Tablero del juego"
            data-i18n-aria-label="board.label"
          ></canvas>
          <div class="status" role="status" aria-live="polite" hidden>
            <p class="status-title"></p>
            <p class="status-hint"></p>
          </div>
        </div>
        <dl class="hud">
          <div class="hud-item">
            <dt data-i18n="hud.score">Puntos</dt>
            <dd>
              <canvas class="digits" aria-hidden="true"></canvas
              ><span class="visually-hidden" data-value="score">0</span>
            </dd>
          </div>
          <div class="hud-item">
            <dt data-i18n="hud.speed">Velocidad</dt>
            <dd>
              <canvas class="digits" aria-hidden="true"></canvas
              ><span class="visually-hidden" data-value="speed">1</span>
            </dd>
          </div>
          <div class="hud-item">
            <dt data-i18n="hud.record">Récord</dt>
            <dd>
              <canvas class="digits" aria-hidden="true"></canvas
              ><span class="visually-hidden" data-value="record">0</span>
            </dd>
          </div>
        </dl>
      </div>
      <button class="locale-switch" type="button" data-i18n="locale.switch">
        English
      </button>
    </main>
  </body>
</html>
